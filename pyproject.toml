[project]
name = "automuon"
dynamic = ["version"]
description = "Automatically split PyTorch parameters between Muon and Adam"
readme = "README.md"
authors = [
    { name = "310hz", email = "90894519+310hz@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["deep-learning", "optimizer", "muon", "adam", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.9",
]

[project.urls]
Homepage = "https://github.com/310hz/automuon"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B010"]

[tool.ty.src]
exclude = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
